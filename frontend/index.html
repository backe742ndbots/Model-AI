<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Property AI Portal</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f4f4f9;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
        }

        .chat-box {
            border: 1px solid #ddd;
            height: 320px;
            overflow-y: auto;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 0.95rem;
        }

        .user {
            background: #007bff;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .ai {
            background: #e9ecef;
            color: #333;
            margin-right: auto;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            padding: 12px 25px;
            border: none;
            background: #28a745;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            background: #ccc;
        }

        .status {
            font-size: 0.8em;
            margin-top: 10px;
            text-align: center;
        }

        .status.online {
            color: green;
        }

        .status.offline {
            color: red;
        }

        /* 🔹 Property cards */
        .property-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .property-card strong {
            font-size: 1rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>🏠 Property AI Portal</h2>

        <div class="chat-box" id="chatBox">
            <div class="message ai">
                Hello! 👋 Ask me about properties, locations, or prices.
            </div>
        </div>

        <div class="controls">
            <input type="text" id="userInput" placeholder="e.g. 2 BHK in Mumbai under 80 lakhs"
                onkeypress="handleEnter(event)" />
            <button onclick="sendQuery()" id="sendBtn">Send</button>
        </div>

        <div class="status" id="statusText">Checking server connection...</div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/query";
        const HEALTH_URL = "http://127.0.0.1:8000/health";

        // 🔹 Health check
        async function checkHealth() {
            const statusEl = document.getElementById("statusText");
            try {
                const res = await fetch(HEALTH_URL);
                if (res.ok) {
                    statusEl.innerText = "🟢 System Online";
                    statusEl.className = "status online";
                }
            } catch {
                statusEl.innerText = "🔴 System Offline (Backend not running)";
                statusEl.className = "status offline";
            }
        }

        // 🔹 Send query
        async function sendQuery() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, "user");
            input.value = "";
            input.disabled = true;
            document.getElementById("sendBtn").disabled = true;

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text })
                });

                const data = await res.json();
                console.log("FULL backend response 👉", data);
                addMessage(data.reply_text || "Here are the results:", "ai");

                if (data.intent === "property_search" && Array.isArray(data.results)) {
                    console.log("the card called")
                    renderProperties(data.results);
                }



            } catch (err) {
                addMessage("❌ Error contacting server.", "ai");
                console.error(err);
            } finally {
                input.disabled = false;
                document.getElementById("sendBtn").disabled = false;
                input.focus();
            }
        }

        // 🔹 Add chat message
        function addMessage(text, sender) {
            const box = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = `message ${sender}`;
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // 🔹 Render property cards
        function renderProperties(properties) {
            const box = document.getElementById("chatBox");

            properties.forEach((p, index) => {
                const card = document.createElement("div");
                card.className = "property-card";

                const locationParts = [
                    p.city,
                    p.block && `Block ${p.block}`,
                    p.pocket && `Pocket ${p.pocket}`,
                    p.sector && `Sector ${p.sector}`
                ].filter(Boolean).join(", ");

                const price = p.price
                    ? `₹ ${p.price}`
                    : "Price on request";

                card.innerHTML = `
            <strong>🏠 Property ${index + 1}</strong><br/>
            📍 <b>Location:</b> ${locationParts || "Not specified"}<br/>
            🏢 <b>BHK:</b> ${p.bhk || "N/A"}<br/>
            💰 <b>Price:</b> ${price}<br/>
            📌 <b>Status:</b> ${p.status || "N/A"}
        `;

                box.appendChild(card);
            });

            box.scrollTop = box.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === "Enter") sendQuery();
        }

        checkHealth();
    </script>

</body>

</html>
